<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="학생과 관리자를 위한 만화책 예약·대여 관리 서비스">
  <title>{{ title or "책마루" }} · 책마루</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav">
    <div class="container-fluid page-shell">
      <a class="navbar-brand brand-lockup" href="{{ url_for('main.index') }}" aria-label="책마루 홈">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>책마루</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <a class="nav-link" href="{{ url_for('student.dashboard') }}">학생 공간</a>
          <a class="nav-link" href="{{ url_for('student.books') }}">책 둘러보기</a>
          <a class="nav-link" href="{{ url_for('admin.dashboard') }}">관리자 센터</a>
          <span class="nav-status"><span class="status-dot"></span> PHASE 1 기반 준비 중</span>
        </div>
      </div>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container-fluid page-shell d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>책마루 · 함께 읽고, 차곡차곡 기록하는 서가</span>
      <span class="footer-muted">한국 시간 기준 운영 · 데이터는 안전하게 연결됩니다</span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
