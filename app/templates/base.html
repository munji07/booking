<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "책마루" }} · 책마루</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg site-nav"><div class="container-fluid page-shell"><a class="navbar-brand brand-lockup" href="{{ url_for('main.index') }}"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>책마루</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="메뉴 열기"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
<a class="nav-link" href="{{ url_for('student.books') }}"><i class="bi bi-search"></i> 책 둘러보기</a>
{% if current_user.is_authenticated and current_user.role == 'student' %}
<a class="nav-link" href="{{ url_for('student.dashboard') }}"><i class="bi bi-person-circle"></i> 학생 공간</a>
<a class="nav-link" href="{{ url_for('student.account') }}">내 계정</a>
<form class="d-inline" method="post" action="{{ url_for('student.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="nav-link nav-auth-link border-0 bg-transparent" type="submit">로그아웃</button></form>
{% elif current_user.is_authenticated and current_user.role == 'admin' %}
<a class="nav-link" href="{{ url_for('admin.dashboard') }}"><i class="bi bi-speedometer2"></i> 관리자</a>
<form class="d-inline" method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="nav-link nav-auth-link border-0 bg-transparent" type="submit">관리자 로그아웃</button></form>
{% else %}
<a class="nav-link nav-login" href="{{ url_for('student.login') }}"><i class="bi bi-box-arrow-in-right"></i> 학생 로그인</a>
<a class="nav-link nav-admin" href="{{ url_for('admin.login') }}">관리자</a>
{% endif %}
</div></div></div></nav>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer"><div class="container-fluid page-shell d-flex flex-column flex-md-row justify-content-between gap-2"><span>책마루 · 함께 읽고, 차곡차곡 기록하는 시간</span><span class="footer-muted">안전한 데이터와 편안한 이용 경험</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
