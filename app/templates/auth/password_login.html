{% extends "base.html" %}
{% block content %}
<div class="container page-shell section-space narrow-content"><div class="panel-card auth-card"><div class="eyebrow">BOOKMARU / LOGIN</div><h1>학생 로그인</h1><p class="text-muted">초대코드로 계정을 만든 뒤 아이디와 비밀번호로 로그인하세요.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('student.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">아이디</label><input class="form-control mb-3" name="username" required autofocus><label class="form-label">비밀번호</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100" type="submit">로그인</button></form><a class="btn btn-link w-100 mt-2" href="{{ url_for('main.student_access') }}">초대코드로 가입하기</a></div></div>
{% endblock %}
