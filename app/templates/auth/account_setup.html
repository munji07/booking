{% extends "base.html" %}
{% block content %}
<div class="container page-shell section-space narrow-content"><div class="panel-card auth-card"><div class="eyebrow">BOOKMARU / ACCOUNT</div><h1>학생 계정 만들기</h1><p class="text-muted">아이디와 비밀번호를 정하면 바로 로그인됩니다.</p><form method="post" action="{{ url_for('student.invite') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="code" value="{{ code }}"><label class="form-label">아이디</label><input class="form-control mb-3" name="username" required autofocus><label class="form-label">비밀번호 (8자 이상)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100" type="submit">계정 만들고 시작하기</button></form></div></div>
{% endblock %}
