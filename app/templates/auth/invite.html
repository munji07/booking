{% extends "base.html" %}
{% block content %}
<div class="container page-shell section-space narrow-content"><div class="panel-card auth-card"><div class="eyebrow">BOOKMARU / INVITE</div><h1>초대코드로 가입</h1><p class="text-muted">관리자에게 받은 초대코드를 입력하면 학생 계정을 만들 수 있습니다.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('student.invite') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">초대코드</label><input class="form-control mb-3" name="code" placeholder="관리자에게 받은 코드" required autofocus><button class="btn btn-primary w-100" type="submit">초대코드 확인</button></form></div></div>
{% endblock %}
